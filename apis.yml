name: Muni
description: Muni was a Latin American social-commerce and community group-buying platform founded in
  2019 in Bogota, Colombia by Maria Echeverri Gomez, aiming to transform e-commerce across LATAM by
  letting community leaders aggregate neighborhood demand and buy everyday grocery and household items
  at prices up to 40 percent below competitors, with no added shipping or service fees. It raised a
  Series A from Lightspeed Venture Partners in 2021 and at its peak served over 15,000 communities
  across Colombia, Brazil, and Mexico. As of this enrichment pass the company's primary domain
  (munitienda.com) resolves to a parked GoDaddy lander with no active product, developer portal, or
  public API surface, so the profile remains a consumer-app portfolio lead with no discoverable API.
